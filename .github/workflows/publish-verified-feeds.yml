name: Publish verified 0.1.5 update feeds
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download versioned releases and verify signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir mac windows
          gh release download macos-v0.1.5 --repo "$GITHUB_REPOSITORY" --pattern Claarify-macOS.dmg --pattern appcast-macos.xml --dir mac
          gh release download windows-v0.1.5 --repo "$GITHUB_REPOSITORY" --pattern Claarify-Windows-Setup.exe --pattern appcast-windows.xml --dir windows
          python3 - <<'PY'
          import base64, pathlib, re, subprocess, xml.etree.ElementTree as ET
          public=base64.b64decode('SfX05t0Mmy64TTd2k9hXot/GwhFS0RmJC5YHqbBkDjI=')
          pathlib.Path('public.der').write_bytes(bytes.fromhex('302a300506032b6570032100')+public)
          ns={'s':'http://www.andymatuschak.org/xml-namespaces/sparkle'}
          def verify(data,signature,label):
              pathlib.Path('payload').write_bytes(data)
              pathlib.Path('signature').write_bytes(base64.b64decode(signature,validate=True))
              subprocess.run(['openssl','pkeyutl','-verify','-pubin','-inkey','public.der','-keyform','DER','-rawin','-in','payload','-sigfile','signature'],check=True)
              print('Verified '+label)
          for platform,filename in [('mac','Claarify-macOS.dmg'),('windows','Claarify-Windows-Setup.exe')]:
              feed=pathlib.Path(platform, 'appcast-'+('macos' if platform=='mac' else 'windows')+'.xml')
              raw=feed.read_bytes(); root=ET.fromstring(raw); items=root.findall('./channel/item')
              assert len(items)==1
              item=items[0]; enclosure=item.find('enclosure'); data=pathlib.Path(platform,filename).read_bytes()
              version=item.findtext('s:version',namespaces=ns) if platform=='mac' else enclosure.get('{'+ns['s']+'}version')
              assert version==('6' if platform=='mac' else '0.1.5')
              tag=('macos' if platform=='mac' else 'windows')+'-v0.1.5'
              assert enclosure.get('url')=='https://github.com/'+__import__('os').environ['GITHUB_REPOSITORY']+'/releases/download/'+tag+'/'+filename
              assert int(enclosure.get('length'))==len(data)
              verify(data,enclosure.get('{'+ns['s']+'}edSignature'),filename)
              if platform=='mac':
                  marker=b'<!-- sparkle-signatures:'; signed=raw.split(marker)[0]
                  signature=re.search(rb'edSignature: ([A-Za-z0-9+/=]+)',raw.split(marker)[1]).group(1)
                  verify(signed,signature,'signed Mac feed')
          PY
      - name: Publish verified feeds after release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload update-feed mac/appcast-macos.xml windows/appcast-windows.xml --repo "$GITHUB_REPOSITORY" --clobber
          mkdir downloaded
          gh release download update-feed --repo "$GITHUB_REPOSITORY" --pattern appcast-macos.xml --pattern appcast-windows.xml --dir downloaded
          cmp mac/appcast-macos.xml downloaded/appcast-macos.xml
          cmp windows/appcast-windows.xml downloaded/appcast-windows.xml
